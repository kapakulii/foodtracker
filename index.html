<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FoodTracker MVP</title>
  <style>
    :root {
      --term-bg: #100800;
      --term-fg: #ffd28e;
      --term-dim: #c68b43;
      --term-glow: rgba(255, 210, 142, 0.42);
      --term-line: rgba(198, 139, 67, 0.42);
      --inactive: rgba(255, 210, 142, 0.28);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--term-bg);
      color: var(--term-fg);
    }

    html {
      font-size: 14px;
    }

    body {
      font-family: monospace;
      padding:
        calc(1.4em + env(safe-area-inset-top))
        calc(2.4em + env(safe-area-inset-right))
        calc(1.4em + env(safe-area-inset-bottom))
        calc(2.4em + env(safe-area-inset-left));
      line-height: 1.35;
      text-shadow: 0 0 6px var(--term-glow);
    }

    .app-shell {
      width: 100%;
      max-width: 100rem;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 1em;
      animation: shell-flicker 16s infinite, shell-drift 45s ease-in-out infinite;
      transform-origin: center;
      position: relative;
      overflow: hidden;
    }

    .app-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255, 210, 142, 0.08) 0px,
          rgba(255, 210, 142, 0.08) 1px,
          rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0) 4px
        );
      opacity: 0.24;
      animation: lines-flicker 0.9s steps(2, end) infinite;
    }

    .app-shell > * {
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1em;
    }

    .title,
    .stamp,
    .panel-meta {
      margin: 0;
      color: var(--term-dim);
    }

    .mobile-tab-dock {
      display: none;
    }

    .mobile-view-tabs {
      display: none;
      gap: 0.35rem;
      flex-wrap: wrap;
      width: 100%;
    }

    .mview-tab {
      border: 1px solid var(--term-line);
      padding: 4px 8px;
      background: transparent;
      color: var(--term-dim);
      font-family: monospace;
      font-size: 1em;
      line-height: 1.35;
      cursor: pointer;
      user-select: none;
      text-shadow: inherit;
    }

    .mview-tab:hover:not(.active) {
      color: var(--term-fg);
      border-color: var(--term-fg);
    }

    .mview-tab.active {
      background: var(--term-fg);
      border-color: var(--term-fg);
      color: var(--term-bg);
      text-shadow: none;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 2rem;
      align-items: start;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 0.75em;
      min-width: 0;
      position: relative;
    }

    .column-right::before {
      content: "";
      position: absolute;
      left: -1.4em;
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom, rgba(255,210,142,0), var(--term-line), rgba(255,210,142,0));
    }

    .ascii-panel {
      min-width: 0;
    }

    .period-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 0.6em;
    }

    .ptab {
      border: 1px solid var(--term-line);
      padding: 4px 8px;
      background: transparent;
      color: var(--term-dim);
      font-family: monospace;
      font-size: 1em;
      line-height: 1.35;
      cursor: pointer;
      user-select: none;
    }

    .ptab:hover:not(.active) {
      color: var(--term-fg);
      border-color: var(--term-fg);
    }

    .ptab.active {
      background: var(--term-fg);
      border-color: var(--term-fg);
      color: var(--term-bg);
      text-shadow: none;
    }

    pre {
      margin: 0;
      width: 100%;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: break-word;
      font: inherit;
      color: var(--term-fg);
      position: relative;
    }

    pre::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -10%;
      height: 2px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(255,210,142,0),
        rgba(255,210,142,0.2),
        rgba(255,210,142,0)
      );
      opacity: 0.18;
      animation: sweep 45s linear infinite;
    }

    .bar-wrap { display: inline-block; position: relative; height: 1em; }
    .bar-fill { display: inline-block; white-space: pre; }
    .bar-inactive { color: var(--inactive); }

    @keyframes lines-flicker {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.28; }
    }

    @keyframes sweep {
      0% { top: -10%; }
      100% { top: 110%; }
    }

    @keyframes shell-flicker {
      0%, 100% { filter: brightness(1); }
      97% { filter: brightness(1); }
      98% { filter: brightness(1.015); }
      99% { filter: brightness(0.994); }
    }

    @keyframes shell-drift {
      0%, 100% { transform: perspective(1600px) scale(1); }
      50% { transform: perspective(1600px) scale(1.0015); }
    }

    @media (max-width: 1199px) {
      html, body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      body {
        padding:
          calc(0.8rem + env(safe-area-inset-top))
          calc(0.45rem + env(safe-area-inset-right))
          calc(10.6rem + env(safe-area-inset-bottom))
          calc(0.45rem + env(safe-area-inset-left));
      }

      .mobile-view-tabs,
      .mobile-secondary-tabs {
        gap: 0.45rem;
        margin-bottom: 0;
      }

      .layout {
        display: block;
      }

      .column {
        display: block;
        width: 100%;
        padding-inline: 0.35rem;
      }

      .column + .column {
        margin-top: 1.25em;
      }

      .app-shell[data-mobile-view="stats"] .column-right {
        margin-top: 0;
      }

      .column-right::before {
        display: none;
      }

      .ascii-panel {
        width: 100%;
        margin: 0 auto;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
        padding-inline: 0.35rem;
      }

      .column .period-tabs {
        display: none;
      }

      .mobile-tab-dock {
        display: flex;
        flex-direction: column;
        position: fixed;
        left: calc(0.45rem + env(safe-area-inset-left));
        right: calc(0.45rem + env(safe-area-inset-right));
        bottom: 0;
        z-index: 30;
        background: var(--term-bg);
        padding:
          0.45rem
          0
          calc(0.55rem + env(safe-area-inset-bottom))
          0;
      }

      .mobile-tab-dock::before {
        content: "";
        position: absolute;
        left: -0.45rem;
        right: -0.45rem;
        top: -0.45rem;
        bottom: 0;
        background: var(--term-bg);
        z-index: -1;
        pointer-events: none;
      }

      .mobile-view-tabs,
      .mobile-secondary-tabs {
        display: flex;
      }

      .mview-tab,
      .mobile-secondary-tabs .ptab {
        flex: 1 1 0;
        text-align: center;
        min-height: 3.4rem;
        padding: 0.8rem 0.9rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mview-tab {
        min-height: 3.8rem;
        font-size: 1.12em;
      }

      .mobile-secondary-tabs {
        width: 100%;
        margin-bottom: 0.45rem;
      }

      .mobile-secondary-tabs .ptab {
        min-height: 2.9rem;
        font-size: 0.96em;
        padding: 0.55rem 0.7rem;
      }

      .app-shell[data-mobile-view="tracker"] .column-right,
      .app-shell[data-mobile-view="stats"] .column-left {
        display: none;
      }

      .app-shell {
        max-width: none;
        min-height: auto;
        animation: none;
        transform: none;
        overflow: visible;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-shell,
      pre::before {
        animation: none;
      }
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 50;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-y: auto;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--term-bg);
      border: 1px solid var(--term-line);
      padding: 1.2rem;
      max-width: 36rem;
      width: 100%;
      margin-top: 2rem;
    }
    .modal-box h2 {
      margin: 0 0 0.8rem;
      color: var(--term-fg);
      font-size: 1em;
      text-transform: uppercase;
    }
    .modal-box label {
      display: block;
      margin-top: 0.5rem;
      color: var(--term-dim);
    }
    .modal-box input,
    .modal-box select,
    .modal-box textarea {
      width: 100%;
      background: #1a1208;
      border: 1px solid var(--term-line);
      color: var(--term-fg);
      font: inherit;
      font-size: 0.95em;
      padding: 0.4em 0.5em;
      margin-top: 0.15em;
      box-sizing: border-box;
    }
    .modal-box textarea { min-height: 2.4em; resize: vertical; }
    .modal-box input:focus,
    .modal-box select:focus,
    .modal-box textarea:focus {
      outline: none;
      border-color: var(--term-fg);
    }
    .modal-actions {
      display: flex;
      gap: 0.5em;
      margin-top: 1em;
      flex-wrap: wrap;
    }
    .modal-actions button {
      border: 1px solid var(--term-line);
      padding: 0.4em 0.9em;
      background: transparent;
      color: var(--term-fg);
      font: inherit;
      cursor: pointer;
    }
    .modal-actions button:hover {
      border-color: var(--term-fg);
    }
    .modal-actions button.primary {
      background: var(--term-fg);
      color: var(--term-bg);
      border-color: var(--term-fg);
      text-shadow: none;
    }
    .modal-actions button.danger {
      border-color: #e44;
      color: #e44;
    }

    /* FAB */
    .fab {
      position: fixed;
      right: 1.2rem;
      bottom: 5rem;
      z-index: 40;
      width: 3.2rem;
      height: 3.2rem;
      border-radius: 50%;
      border: 1px solid var(--term-fg);
      background: var(--term-bg);
      color: var(--term-fg);
      font-size: 1.6em;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fab:hover {
      background: var(--term-fg);
      color: var(--term-bg);
    }

    /* AI chat panel */
    .ai-toggle {
      position: fixed;
      right: 1.2rem;
      bottom: 1.2rem;
      z-index: 40;
      border: 1px solid var(--term-line);
      padding: 0.35em 0.7em;
      background: var(--term-bg);
      color: var(--term-dim);
      font: inherit;
      font-size: 0.85em;
      cursor: pointer;
    }
    .ai-toggle:hover {
      color: var(--term-fg);
      border-color: var(--term-fg);
    }
    .ai-chat-panel {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 60;
      background: var(--term-bg);
      border-top: 1px solid var(--term-line);
      padding: 0.6rem 1rem calc(0.6rem + env(safe-area-inset-bottom));
      max-height: 50vh;
      flex-direction: column;
    }
    .ai-chat-panel.active { display: flex; }
    .ai-chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4em;
      color: var(--term-dim);
      font-size: 0.85em;
    }
    .ai-chat-close {
      background: none;
      border: none;
      color: var(--term-dim);
      cursor: pointer;
      font: inherit;
    }
    .ai-chat-close:hover { color: var(--term-fg); }
    .ai-chat-msgs {
      overflow-y: auto;
      flex: 1;
      padding: 0.3em 0;
      font-size: 0.92em;
      max-height: 30vh;
    }
    .ai-msg { margin-bottom: 0.5em; }
    .ai-msg-user { color: var(--term-fg); }
    .ai-msg-assistant { color: var(--term-dim); }
    .ai-msg-explanation { margin: 0.2em 0; }
    .ai-msg-changes { list-style: none; padding: 0; margin: 0.2em 0; }
    .ai-msg-changes li {
      padding: 0.15em 0;
      border-bottom: 1px solid rgba(255,210,142,0.1);
    }
    .ai-msg-changes li:last-child { border-bottom: none; }
    .ai-apply-btn {
      border: 1px solid var(--term-fg);
      padding: 0.3em 0.7em;
      background: var(--term-fg);
      color: var(--term-bg);
      font: inherit;
      cursor: pointer;
      margin-top: 0.3em;
      text-shadow: none;
    }
    .ai-apply-btn:hover { opacity: 0.85; }
    .ai-chat-input-row {
      display: flex;
      gap: 0.4em;
      margin-top: 0.4em;
    }
    .ai-chat-input-row input {
      flex: 1;
      background: #1a1208;
      border: 1px solid var(--term-line);
      color: var(--term-fg);
      font: inherit;
      font-size: 0.95em;
      padding: 0.4em 0.5em;
    }
    .ai-chat-input-row input:focus {
      outline: none;
      border-color: var(--term-fg);
    }
    .ai-chat-input-row button {
      border: 1px solid var(--term-line);
      padding: 0.4em 0.7em;
      background: transparent;
      color: var(--term-fg);
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .ai-chat-input-row button:hover {
      border-color: var(--term-fg);
    }

    /* Interactive meals list */
    .meals-interactive { margin-top: 0.75em; }
    .meal-entry {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0.35em 0;
      border-bottom: 1px solid rgba(255,210,142,0.08);
      cursor: pointer;
      gap: 0.5em;
    }
    .meal-entry:hover { background: rgba(255,210,142,0.04); }
    .meal-entry-main { flex: 1; min-width: 0; }
    .meal-entry-title {
      color: var(--term-fg);
      font-size: 0.95em;
      word-break: break-word;
    }
    .meal-entry-meta {
      color: var(--term-dim);
      font-size: 0.82em;
      margin-top: 0.15em;
    }
    .meal-entry-cal {
      color: var(--term-fg);
      white-space: nowrap;
      font-size: 0.95em;
    }
    .meal-header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.4em 0 0.15em;
      margin-top: 0.3em;
      color: var(--term-dim);
      font-size: 0.92em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--term-line);
    }
    .meal-add-small {
      background: none;
      border: 1px solid var(--term-line);
      color: var(--term-dim);
      cursor: pointer;
      font: inherit;
      font-size: 0.85em;
      padding: 0.1em 0.4em;
    }
    .meal-add-small:hover {
      color: var(--term-fg);
      border-color: var(--term-fg);
    }

    @media (max-width: 1199px) {
      .fab { bottom: 6.5rem; }
      .ai-chat-panel {
        padding-left: 0.45rem;
        padding-right: 0.45rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="app">
    <div class="topbar">
      <pre class="title" id="title">FOOD_TRACKER</pre>
    </div>
    <div class="mobile-tab-dock" id="mobile-tab-dock">
      <div class="mobile-secondary-tabs" id="mobile-secondary-tabs"></div>
      <div class="mobile-view-tabs" id="mobile-view-tabs">
        <button class="mview-tab active" type="button" data-mobile-view="tracker">ТРЕКЕР</button>
        <button class="mview-tab" type="button" data-mobile-view="stats">СТАТИСТИКА</button>
      </div>
    </div>
    <div class="layout">
      <div class="column column-left">
        <section class="ascii-panel">
          <div class="period-tabs" id="day-tabs">
            <span class="ptab" data-day="yesterday">ВЧЕРА</span>
            <span class="ptab active" data-day="today">СЕГОДНЯ</span>
          </div>
          <pre id="left-panel">инициализация…</pre>
        </section>
        <section class="ascii-panel meals-interactive" id="meals-interactive"></section>
      </div>
      <div class="column column-right">
        <section class="ascii-panel">
          <div class="period-tabs" id="period-tabs">
            <span class="ptab active" data-period="7">7 ДН</span>
            <span class="ptab" data-period="14">14 ДН</span>
            <span class="ptab" data-period="30">30 ДН</span>
            <span class="ptab" data-period="weeks">НЕДЕЛИ</span>
            <span class="ptab" data-period="months">МЕСЯЦЫ</span>
          </div>
          <pre id="right-panel">инициализация…</pre>
        </section>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay"><div class="modal-box" id="modal-box"></div></div>

  <button class="fab" id="fab-btn" title="Добавить запись">+</button>

  <button class="ai-toggle" id="ai-toggle">[AI]</button>

  <div class="ai-chat-panel" id="ai-chat-panel">
    <div class="ai-chat-header">
      <span>AI Ассистент</span>
      <button class="ai-chat-close" id="ai-chat-close">✕</button>
    </div>
    <div class="ai-chat-msgs" id="ai-chat-msgs">
      <div class="ai-msg ai-msg-assistant" style="color:var(--term-dim);">Напиши, что хочешь изменить. Например:<br>— добавить овсянку на завтрак<br>— удалить последний приём пищи<br>— изменить цель калорий на 2000</div>
    </div>
    <div class="ai-chat-input-row">
      <input id="ai-input" type="text" placeholder="Команда..." autocomplete="off">
      <button id="ai-send">→</button>
    </div>
  </div>

  <script>
    const DAY_NAMES = ["ВС", "ПН", "ВТ", "СР", "ЧТ", "ПТ", "СБ"];
    const MONTH_SHORT = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];

    let currentPeriod = "7";
    let currentDayView = "today";
    let currentMobileView = "tracker";
    let globalProfile = null;
    let globalEntries = [];
    let globalDailyMetrics = [];
    let bitGlitchTimer = null;
    let panelMetrics = {
      leftChars: 72,
      rightChars: 72,
      leftBarW: 28,
      rightBarW: 24,
      chartW: 38
    };

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function shiftDate(dateStr, deltaDays) {
      const d = new Date(dateStr + "T12:00:00");
      d.setDate(d.getDate() + deltaDays);
      return d.toISOString().slice(0, 10);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function round1(value) {
      return Math.round(value * 10) / 10;
    }

    function sumField(items, field) {
      return items.reduce((sum, item) => sum + (Number(item[field]) || 0), 0);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function fmtDate(dateStr) {
      const d = new Date(dateStr + "T12:00:00");
      return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0");
    }

    function fmtDateLong(dateStr) {
      const d = new Date(dateStr + "T12:00:00");
      return DAY_NAMES[d.getDay()] + ", " + fmtDate(dateStr) + "." + d.getFullYear();
    }

    function getUserStamp(profile) {
      if (profile.user_id) {
        return "USER " + String(profile.user_id);
      }

      const source = String(profile.name || profile.created_at || "1");
      let hash = 0;
      for (let i = 0; i < source.length; i++) {
        hash = ((hash << 5) - hash + source.charCodeAt(i)) | 0;
      }
      const number = String(Math.abs(hash)).slice(0, 6).padStart(6, "0");
      return "USER " + number;
    }

    function getViewportMode() {
      if (window.innerWidth < 1200) return "mobile";
      return "desktop";
    }

    function updateResponsiveScale() {
      const root = document.documentElement;
      if (window.innerWidth < 1200) {
        root.style.fontSize = (window.innerWidth / 40) + "px";
      } else {
        root.style.fontSize = "14px";
      }
    }

    function roundDisplay(value, unit) {
      if (unit === "мг") return Math.round(value);
      return Math.round(value);
    }

    function daysInMonth(year, month) {
      return new Date(year, month + 1, 0).getDate();
    }

    function makeSection(title, width) {
      const lineW = Math.max(12, width || 28);
      if (getViewportMode() === "mobile") {
        const titleText = " " + title + " ";
        const dashW = Math.max(0, lineW - titleText.length);
        const leftW = Math.floor(dashW / 2);
        const rightW = dashW - leftW;
        return "┌" + "─".repeat(leftW) + titleText + "─".repeat(rightW) + "┐\n\n";
      }

      return "┌" + "─".repeat(lineW) + "┐\n" +
        "│ " + title.padEnd(lineW - 2, " ") + "│\n" +
        "└" + "─".repeat(lineW) + "┘\n\n";
    }

    function fitSectionWidth(kind, preferredWidth, minWidth) {
      const isLeft = kind === "left" || kind === "meals";
      const available = getViewportMode() === "mobile"
        ? Math.min(panelMetrics.leftChars, panelMetrics.rightChars)
        : (isLeft ? panelMetrics.leftChars : panelMetrics.rightChars);
      const cap = Math.max((minWidth || 18), available - 2);
      return clamp(Math.min(preferredWidth, cap), minWidth || 18, cap);
    }

    function bar(value, target, width) {
      if (!target || width <= 0) {
        return "░".repeat(Math.max(width, 0));
      }
      const filled = clamp(Math.round((Math.min(value, target) / target) * width), 0, width);
      return "█".repeat(filled) + "░".repeat(width - filled);
    }

    function formatDelta(value, unit) {
      return unit === "мг" ? Math.round(value) : round1(value);
    }

    function getPanelCharCapacity(elementId) {
      const element = document.getElementById(elementId);
      if (!element) {
        return null;
      }

      const width = element.clientWidth;
      if (!width) {
        return null;
      }

      const style = window.getComputedStyle(element);
      const canvas = getPanelCharCapacity.canvas || (getPanelCharCapacity.canvas = document.createElement("canvas"));
      const ctx = canvas.getContext("2d");
      ctx.font = [style.fontWeight, style.fontSize, style.fontFamily].filter(Boolean).join(" ");
      const charWidth = ctx.measureText("0").width || (parseFloat(style.fontSize) * 0.62) || 8;

      return Math.max(24, Math.floor(width / charWidth) - 1);
    }

    function computePanelMetrics() {
      const isMobile = getViewportMode() === "mobile";
      const leftChars = getPanelCharCapacity("left-panel") || (isMobile ? 68 : 72);
      const rightChars = getPanelCharCapacity("right-panel") || (isMobile ? 68 : 72);
      return {
        leftChars,
        rightChars,
        leftBarW: isMobile ? clamp(leftChars - 28, 18, 80) : clamp(leftChars - 30, 22, 72),
        rightBarW: isMobile ? clamp(rightChars - 18, 20, 84) : clamp(rightChars - 20, 24, 68),
        chartW: isMobile ? clamp(rightChars - 16, 24, 72) : clamp(rightChars - 14, 28, 60)
      };
    }

    function estimateTDEE(profile) {
      const weight = Number(profile.current_weight_kg) || 79;
      const height = Number(profile.height_cm) || 172;
      const age = Number(profile.age) || 28;
      const sex = profile.sex === "female" ? "female" : "male";
      const activityFactor = Number(profile.activity_factor) || 1.35;
      const bmr = sex === "female"
        ? 10 * weight + 6.25 * height - 5 * age - 161
        : 10 * weight + 6.25 * height - 5 * age + 5;
      return Math.round(bmr * activityFactor);
    }

    function bmi(weight, heightCm) {
      const h = (Number(heightCm) || 172) / 100;
      if (!h) return 0;
      return weight / (h * h);
    }

    function getWaistSeries(dailyMetrics) {
      return dailyMetrics
        .filter((metric) => metric.date && Number(metric.waist_cm))
        .sort((a, b) => a.date.localeCompare(b.date))
        .map((metric) => ({
          date: metric.date,
          waist: Number(metric.waist_cm)
        }));
    }

    function getTargets(profile) {
      const calories = Number(profile.daily_calorie_target) || 2200;
      const weight = Number(profile.current_weight_kg) || 79;
      const proteinRecommended = Math.round(weight * 1.8);
      const fatRecommended = Math.round(weight * 0.8);
      const carbsRecommended = Math.max(130, Math.round((calories - proteinRecommended * 4 - fatRecommended * 9) / 4));
      const fiberRecommended = Math.max(25, Math.round((calories / 1000) * 14));

      return {
        calories,
        protein: Number(profile.protein_target_g) || proteinRecommended,
        fat: Number(profile.fat_target_g) || fatRecommended,
        carbs: Number(profile.carbs_target_g) || carbsRecommended,
        fiber: Number(profile.fiber_target_g) || fiberRecommended,
        sugar: Number(profile.sugar_target_g) || 50,
        sodium: Number(profile.sodium_target_mg) || 2300,
        saturatedFat: Number(profile.saturated_fat_target_g) || Math.round((calories * 0.1) / 9),
        recommended: {
          protein: proteinRecommended,
          fat: fatRecommended,
          carbs: carbsRecommended,
          fiber: fiberRecommended
        }
      };
    }

    function getTodayMetrics(entries) {
      return {
        calories: Math.round(sumField(entries, "calories")),
        protein: round1(sumField(entries, "protein")),
        fat: round1(sumField(entries, "fat")),
        carbs: round1(sumField(entries, "carbs")),
        fiber: round1(sumField(entries, "fiber")),
        sugar: round1(sumField(entries, "sugar")),
        sodium: Math.round(sumField(entries, "sodium_mg")),
        saturatedFat: round1(sumField(entries, "saturated_fat"))
      };
    }

    function buildToday(profile, entries, dateStr, sectionTitle) {
      const viewportMode = getViewportMode();
      const compact = viewportMode === "mobile";
      const targets = getTargets(profile);
      const metrics = getTodayMetrics(entries);
      const tdee = estimateTDEE(profile);
      const deficit = tdee - targets.calories;
      const rows = [
        ["БЕЛКИ", metrics.protein, targets.protein, "г"],
        ["ЖИРЫ", metrics.fat, targets.fat, "г"],
        ["УГЛЕВОДЫ", metrics.carbs, targets.carbs, "г"],
        ["КЛЕТЧАТКА", metrics.fiber, targets.fiber, "г"]
      ];

      if (metrics.sugar > 0 || profile.sugar_target_g) {
        rows.push(["САХАР", metrics.sugar, targets.sugar, "г"]);
      }
      if (metrics.sodium > 0 || profile.sodium_target_mg) {
        rows.push(["НАТРИЙ", metrics.sodium, targets.sodium, "мг"]);
      }
      if (metrics.saturatedFat > 0 || profile.saturated_fat_target_g) {
        rows.push(["НАСЫЩ. ЖИРЫ", metrics.saturatedFat, targets.saturatedFat, "г"]);
      }

      const calorieLabel = "КАЛОРИИ";
      const renderedRows = rows.map(([label, value, target, unit]) => [
        label,
        value,
        target,
        unit
      ]);

      const labelW = Math.max(calorieLabel.length, ...renderedRows.map(([label]) => label.length));
      const currentW = Math.max(
        String(Math.round(metrics.calories)).length,
        ...renderedRows.map(([, value, , unit]) => String(roundDisplay(value, unit)).length)
      );
      const targetW = Math.max(
        String(Math.round(targets.calories)).length,
        ...renderedRows.map(([, , target, unit]) => String(roundDisplay(target, unit)).length)
      );
      const lineW = compact ? fitSectionWidth("left", panelMetrics.leftChars - 2, 24) : 0;
      const valueTextW = Math.max(
        (String(Math.round(metrics.calories)) + "  /  " + String(Math.round(targets.calories)) + " ккал").length,
        ...renderedRows.map(([, value, target, unit]) => (
          String(roundDisplay(value, unit)) + "  /  " + String(roundDisplay(target, unit)) + " " + unit
        ).length)
      );
      const barW = clamp(
        panelMetrics.leftChars - labelW - valueTextW - 5,
        compact ? 10 : 18,
        panelMetrics.leftBarW
      );
      const dateLabel = compact
        ? DAY_NAMES[new Date(dateStr + "T12:00:00").getDay()] + " " + fmtDate(dateStr)
        : fmtDateLong(dateStr);

      let out = "";
      out += makeSection(sectionTitle, fitSectionWidth("left", compact ? lineW : barW + 31, compact ? 20 : 24));
      out += "Дата: " + dateLabel + "\n";
      if (compact) {
        out += calorieLabel.padEnd(labelW) + " |" + bar(metrics.calories, targets.calories, barW) + "| ";
        out += String(Math.round(metrics.calories)).padStart(currentW) + "  /  " + String(Math.round(targets.calories)).padStart(targetW) + " ккал\n";
      } else {
        out += calorieLabel.padEnd(labelW) + " |" + bar(metrics.calories, targets.calories, barW) + "| ";
        out += String(Math.round(metrics.calories)).padStart(currentW) + "  /  " + String(Math.round(targets.calories)).padStart(targetW) + " ккал\n";
      }
      out += metrics.calories <= targets.calories
        ? (compact ? "запас " : "в запасе ") + (targets.calories - metrics.calories) + " ккал\n\n"
        : (compact ? "перебор " : "перебор ") + (metrics.calories - targets.calories) + " ккал\n\n";

      renderedRows.forEach(([label, value, target, unit]) => {
        const marker = value > target ? " !" : "  ";
        const displayValue = roundDisplay(value, unit);
        const displayTarget = roundDisplay(target, unit);
        if (compact) {
          out += label.padEnd(labelW) + " |" + bar(value, target, barW) + "|" + marker;
          out += String(displayValue).padStart(currentW) + "  /  " + String(displayTarget).padStart(targetW) + " " + unit + "\n";
        } else {
          out += label.padEnd(labelW) + " |" + bar(value, target, barW) + "|" + marker;
          out += String(displayValue).padStart(currentW) + "  /  " + String(displayTarget).padStart(targetW) + " " + unit + "\n";
        }
      });

      out += "\n";
      if (compact) {
        out += "TDEE: " + tdee + " ккал\n";
        out += deficit > 0 ? "Плановый дефицит: " + deficit + " ккал/д\n" : "Плановый дефицит: не задан\n";
      } else {
        out += "TDEE: " + tdee + " ккал   Плановый дефицит: ";
        out += deficit > 0 ? deficit + " ккал/д" : "дефицит не задан";
        out += "\n";
      }

      return out;
    }

    function buildMeals(entries) {
      const compact = getViewportMode() === "mobile";
      const mealConfig = {
        breakfast: "Завтрак",
        lunch: "Обед",
        dinner: "Ужин",
        snack: "Перекусы"
      };
      const mealOrder = ["breakfast", "lunch", "dinner", "snack"];

      if (!entries.length) {
        return makeSection("ПИТАНИЕ", fitSectionWidth("meals", compact ? panelMetrics.leftChars - 2 : 36, 24)) + "За сегодня записей пока нет.\nДобавь блюда в JSON, и блок заполнится автоматически.";
      }

      let out = makeSection("ПИТАНИЕ", fitSectionWidth("meals", compact ? panelMetrics.leftChars - 2 : 36, 24));
      const weightW = Math.max(...entries.map((entry) => String(Math.round(entry.weight_g)).length)) + 1;
      const proteinW = Math.max(...entries.map((entry) => String(round1(entry.protein)).length)) + 1;
      const fatW = Math.max(...entries.map((entry) => String(round1(entry.fat)).length)) + 1;
      const carbsW = Math.max(...entries.map((entry) => String(round1(entry.carbs)).length)) + 1;
      const fiberW = Math.max(...entries.map((entry) => String(round1(entry.fiber)).length)) + 1;
      const metricGap = compact ? "      " : "      ";

      mealOrder.forEach((mealKey) => {
        const mealEntries = entries.filter((entry) => entry.meal === mealKey);
        if (!mealEntries.length) {
          return;
        }
        const mealCalories = Math.round(sumField(mealEntries, "calories"));
        out += mealConfig[mealKey].toUpperCase() + " :: " + mealCalories + " ккал\n";
        mealEntries.forEach((entry) => {
          const weight = String(Math.round(entry.weight_g)).padStart(weightW) + "г";
          const protein = "Б:" + String(round1(entry.protein)).padStart(proteinW);
          const fat = "Ж:" + String(round1(entry.fat)).padStart(fatW);
          const carbs = "У:" + String(round1(entry.carbs)).padStart(carbsW);
          const fiber = "Кл:" + String(round1(entry.fiber)).padStart(fiberW);
          out += "  " + entry.description + "\n";
          out += "  " + weight + metricGap + protein + metricGap + fat + metricGap + carbs + metricGap + fiber + "\n";
        });
        out += "\n";
      });
      return out.trimEnd();
    }

    function buildHistory(entries, profile, period) {
      const targets = getTargets(profile);
      const dailyTarget = targets.calories;
      const todayStr = today();
      let rows = [];

      if (period === "7" || period === "14" || period === "30") {
        const days = Number(period);
        for (let i = days - 1; i >= 0; i--) {
          const d = new Date(todayStr + "T12:00:00");
          d.setDate(d.getDate() - i);
          const ds = d.toISOString().slice(0, 10);
          const dayEntries = entries.filter((entry) => entry.date === ds);
          const kcal = Math.round(sumField(dayEntries, "calories"));
          const hasData = dayEntries.length > 0;
          rows.push({
            label: DAY_NAMES[d.getDay()] + " " + fmtDate(ds),
            value: kcal,
            target: dailyTarget,
            hasData,
            flag: ""
          });
        }
      } else if (period === "weeks") {
        const weeks = {};
        entries.forEach((entry) => {
          const d = new Date(entry.date + "T12:00:00");
          const weekStart = new Date(d);
          const shift = (d.getDay() + 6) % 7;
          weekStart.setDate(d.getDate() - shift);
          const key = weekStart.toISOString().slice(0, 10);
          if (!weeks[key]) {
            weeks[key] = { kcal: 0, days: new Set(), start: new Date(weekStart) };
          }
          weeks[key].kcal += Number(entry.calories) || 0;
          weeks[key].days.add(entry.date);
        });
        rows = Object.keys(weeks).sort().slice(-8).map((key) => {
          const start = weeks[key].start;
          const end = new Date(start);
          end.setDate(end.getDate() + 6);
          const loggedDays = weeks[key].days.size || 1;
          const avg = Math.round(weeks[key].kcal / loggedDays);
          return {
            label: fmtDate(key) + "–" + fmtDate(end.toISOString().slice(0, 10)),
            value: avg,
            target: dailyTarget,
            hasData: true,
            detail: null,
            detailLabel: "",
            flag: ""
          };
        });
      } else {
        const months = {};
        entries.forEach((entry) => {
          const key = entry.date.slice(0, 7);
          if (!months[key]) {
            const [year, month] = key.split("-").map(Number);
            months[key] = { kcal: 0, days: new Set(), year, month: month - 1 };
          }
          months[key].kcal += Number(entry.calories) || 0;
          months[key].days.add(entry.date);
        });
        rows = Object.keys(months).sort().slice(-6).map((key) => {
          const monthInfo = months[key];
          const loggedDays = monthInfo.days.size || 1;
          const avg = Math.round(monthInfo.kcal / loggedDays);
          return {
            label: MONTH_SHORT[monthInfo.month].toUpperCase() + " " + String(monthInfo.year).slice(2),
            value: avg,
            target: dailyTarget,
            hasData: true,
            detail: null,
            detailLabel: "",
            flag: ""
          };
        });
      }

      if (!rows.length) {
        return "Нет данных за выбранный период.";
      }

      const labelW = Math.max(...rows.map((row) => row.label.length));
      const maxValue = Math.max(...rows.map((row) => Math.max(row.value, row.target)), 1);
      const valueTextW = Math.max(...rows.map((row) => (String(row.value) + "  /  " + String(row.target)).length));
      const barW = clamp(panelMetrics.rightChars - labelW - valueTextW - 5, 12, panelMetrics.rightBarW);
      const valueW = Math.max(...rows.map((row) => String(row.value).length), String(dailyTarget).length);
      let out = makeSection("СТАТИСТИКА :: " + period.toUpperCase(), fitSectionWidth("history", panelMetrics.rightChars - 2, 28));

      rows.forEach((row) => {
        out += row.label.padEnd(labelW) + " |" + bar(row.value, maxValue, barW) + "| ";
        out += String(row.value).padStart(valueW) + "  /  " + String(row.target).padStart(valueW) + "\n";
      });

      out += "\n";
      if (period === "7" || period === "14" || period === "30") {
        out += "Пустые дни показаны отдельно и не означают съеденные 0 ккал.";
      } else {
        out += "Для недель и месяцев показано среднее ккал/день только по заполненным дням.";
      }
      return out;
    }

    function buildWeightSeries(profile, dailyMetrics, period) {
      const metrics = dailyMetrics
        .filter((metric) => metric.date && Number(metric.weight_kg))
        .sort((a, b) => a.date.localeCompare(b.date))
        .map((metric) => ({
          date: metric.date,
          weight: Number(metric.weight_kg)
        }));

      if (!metrics.length) {
        metrics.push({
          date: today(),
          weight: Number(profile.current_weight_kg) || 79
        });
      }

      const lastPoint = metrics[metrics.length - 1];
      const targets = getTargets(profile);
      const tdee = estimateTDEE(profile);
      const plannedDeficit = Math.max(0, tdee - targets.calories);
      const daysByPeriod = { "7": 7, "14": 14, "30": 30, "weeks": 28, "months": 90 };
      const lookbackDays = daysByPeriod[period] || 14;

      let actualCalories = 0;
      let loggedDays = 0;
      for (let i = 0; i < lookbackDays; i++) {
        const d = new Date(today() + "T12:00:00");
        d.setDate(d.getDate() - i);
        const ds = d.toISOString().slice(0, 10);
        const dayCalories = Math.round(sumField(globalEntries.filter((entry) => entry.date === ds), "calories"));
        if (dayCalories > 0) {
          actualCalories += dayCalories;
          loggedDays += 1;
        }
      }

      const avgCalories = loggedDays ? Math.round(actualCalories / loggedDays) : targets.calories;
      const actualDeficit = Math.max(0, tdee - avgCalories);
      const deficitForForecast = actualDeficit || plannedDeficit || 250;

      const forecastDays = 90;
      const forecastPoints = [];
      for (let i = 0; i <= 6; i++) {
        const dayOffset = Math.round((forecastDays / 6) * i);
        const date = new Date(lastPoint.date + "T12:00:00");
        date.setDate(date.getDate() + dayOffset);
        forecastPoints.push({
          date: date.toISOString().slice(0, 10),
          weight: round1(Math.max((Number(profile.target_weight_kg) || 72) - 0.2, lastPoint.weight - (deficitForForecast * dayOffset) / 7700))
        });
      }

      return {
        actual: metrics,
        forecast: forecastPoints,
        avgCalories,
        plannedDeficit,
        actualDeficit
      };
    }

    function renderWeightChart(actualPoints, forecastPoints, targetWeight, width, height) {
      const allPoints = [...actualPoints, ...forecastPoints];
      const timestamps = allPoints.map((point) => new Date(point.date + "T12:00:00").getTime());
      const startTs = Math.min(...timestamps);
      const endTs = Math.max(...timestamps);
      const weights = allPoints.map((point) => point.weight);
      const yMax = Math.max(...weights, targetWeight) + 0.5;
      const yMin = Math.min(...weights, targetWeight) - 0.5;
      const yRange = yMax - yMin || 1;
      const grid = Array.from({ length: height }, () => Array(width).fill(" "));

      function xForDate(dateStr) {
        const ts = new Date(dateStr + "T12:00:00").getTime();
        if (endTs === startTs) {
          return 0;
        }
        return clamp(Math.round(((ts - startTs) / (endTs - startTs)) * (width - 1)), 0, width - 1);
      }

      function yForWeight(weight) {
        return clamp(Math.round(((yMax - weight) / yRange) * (height - 1)), 0, height - 1);
      }

      function drawSeries(points, pointChar, lineChars) {
        let previous = null;
        points.forEach((point) => {
          const x = xForDate(point.date);
          const y = yForWeight(point.weight);
          if (previous) {
            const dx = x - previous.x;
            const dy = y - previous.y;
            const steps = Math.max(Math.abs(dx), Math.abs(dy), 1);
            for (let i = 1; i < steps; i++) {
              const ix = Math.round(previous.x + (dx * i) / steps);
              const iy = Math.round(previous.y + (dy * i) / steps);
              const slope = Math.abs(dy) / steps;
              const symbol = slope < 0.28 ? lineChars.flat : (dy > 0 ? lineChars.down : lineChars.up);
              if (grid[iy][ix] === " " || grid[iy][ix] === "·") {
                grid[iy][ix] = symbol;
              }
            }
          }
          grid[y][x] = pointChar;
          previous = { x, y };
        });
      }

      const targetRow = yForWeight(targetWeight);
      for (let x = 0; x < width; x++) {
        grid[targetRow][x] = "·";
      }

      const monthTicks = [];
      let monthCursor = new Date(new Date(actualPoints[0].date + "T12:00:00").getFullYear(), new Date(actualPoints[0].date + "T12:00:00").getMonth(), 1);
      const lastDate = new Date(forecastPoints[forecastPoints.length - 1].date + "T12:00:00");
      while (monthCursor <= lastDate) {
        const pos = xForDate(monthCursor.toISOString().slice(0, 10));
        monthTicks.push({ pos, label: MONTH_SHORT[monthCursor.getMonth()] });
        for (let row = 0; row < height; row++) {
          if (row !== targetRow && grid[row][pos] === " ") {
            grid[row][pos] = "┆";
          }
        }
        monthCursor.setMonth(monthCursor.getMonth() + 1);
      }

      drawSeries(forecastPoints, "○", { flat: "┄", up: "╱", down: "╲" });
      drawSeries(actualPoints, "●", { flat: "─", up: "╱", down: "╲" });

      const yLabelW = 8;
      let out = "";
      for (let row = 0; row < height; row++) {
        const yValue = yMax - (row / (height - 1)) * yRange;
        const label = row % 2 === 0 ? (yValue.toFixed(1) + " кг").padStart(yLabelW) : " ".repeat(yLabelW);
        out += label + " │" + grid[row].join("") + (row === targetRow ? "  цель" : "") + "\n";
      }

      const tickLine = Array(width).fill(" ");
      const labelLine = Array(width).fill(" ");
      let lastLabelEnd = -100;

      monthTicks.forEach(({ pos, label }) => {
        tickLine[pos] = "┬";
        if (pos - lastLabelEnd >= label.length + 1) {
          for (let i = 0; i < label.length && pos + i < width; i++) {
            labelLine[pos + i] = label[i];
          }
          lastLabelEnd = pos + label.length - 1;
        }
      });

      out += " ".repeat(yLabelW) + " └" + "─".repeat(width) + "\n";
      out += " ".repeat(yLabelW + 2) + tickLine.join("") + "\n";
      out += " ".repeat(yLabelW + 2) + labelLine.join("") + "\n";

      return out;
    }

    function buildWeight(profile, dailyMetrics, period) {
      const isMobile = window.innerWidth < 1200;
      const targetWeight = Number(profile.target_weight_kg) || 72;
      const currentWeight = Number(profile.current_weight_kg) || 79;
      const heightCm = Number(profile.height_cm) || 172;
      const series = buildWeightSeries(profile, dailyMetrics, period);
      const waistSeries = getWaistSeries(dailyMetrics);
      const chart = renderWeightChart(
        series.actual,
        series.forecast,
        targetWeight,
        isMobile ? Math.max(24, panelMetrics.chartW - 6) : panelMetrics.chartW,
        isMobile ? 7 : 9
      );
      const lastActual = series.actual[series.actual.length - 1];
      const delta = round1(lastActual.weight - series.actual[0].weight);
      const currentBmi = round1(bmi(lastActual.weight, heightCm));
      const targetBmi = round1(bmi(targetWeight, heightCm));
      const bmiMin = 18.5;
      const bmiMax = 29;
      const bmiValue = Math.max(bmiMin, Math.min(currentBmi, bmiMax));
      const metricLabelW = 14;
      const bmiValueText = String(currentBmi) + " / " + String(targetBmi);
      const waistValueTextBase = waistSeries.length ? (String(round1(waistSeries[waistSeries.length - 1].waist)) + " см") : "нет данных";
      const metricValueW = Math.max(bmiValueText.length, waistValueTextBase.length, 10);
      const bmiBarW = clamp(panelMetrics.rightChars - metricLabelW - metricValueW - 7, 10, panelMetrics.rightBarW - 2);

      function bmiLabel(value) {
        if (value < 18.5) return "ниже нормы";
        if (value < 25) return "норма";
        if (value < 30) return "избыток";
        return "высокий";
      }

      let out = makeSection("ВЕС", fitSectionWidth("weight", panelMetrics.rightChars - 2, 24));
      if (isMobile) {
        out += "Вес " + lastActual.weight + " → " + targetWeight + " кг\n";
        out += "Старт " + series.actual[0].weight + " кг   Δ " + (delta > 0 ? "+" : "") + delta + " кг\n\n";
      } else {
        out += "Последний вес: " + lastActual.weight + " кг   Цель: " + targetWeight + " кг\n";
        out += "Старт в истории: " + series.actual[0].weight + " кг   Изменение: " + (delta > 0 ? "+" : "") + delta + " кг\n\n";
      }
      out += chart + "\n";
      out += "ИМТ".padEnd(metricLabelW) + " |" + bar(bmiValue - bmiMin, bmiMax - bmiMin, bmiBarW) + "|  ";
      out += bmiValueText.padStart(metricValueW) + "\n";
      out += "СТАТУС ИМТ".padEnd(metricLabelW) + " " + bmiLabel(currentBmi) + "\n";
      if (waistSeries.length) {
        const lastWaist = waistSeries[waistSeries.length - 1];
        const prevWaist = waistSeries.length > 1 ? waistSeries[waistSeries.length - 2] : null;
        const waistDelta = prevWaist ? round1(lastWaist.waist - prevWaist.waist) : 0;
        const waistMin = 75;
        const waistMax = 115;
        const waistBarW = clamp(panelMetrics.rightChars - metricLabelW - metricValueW - 7, 10, panelMetrics.rightBarW - 2);
        const waistValue = Math.max(waistMin, Math.min(lastWaist.waist, waistMax));
        const waistValueText = String(round1(lastWaist.waist)) + " см";
        out += "ТАЛИЯ".padEnd(metricLabelW) + " |" + bar(waistValue - waistMin, waistMax - waistMin, waistBarW) + "|  ";
        out += waistValueText.padStart(metricValueW);
        out += prevWaist ? "  " + (waistDelta > 0 ? "+" : "") + waistDelta + " см" : "";
        out += "\n";
      } else {
        out += "ТАЛИЯ".padEnd(metricLabelW) + " |" + "░".repeat(bmiBarW) + "|  нет данных\n";
      }
      if (isMobile) {
        out += "Факт " + series.avgCalories + " ккал/д   деф. " + series.actualDeficit + "\n";
        out += "План " + currentWeight + " → " + targetWeight + " кг   деф. " + series.plannedDeficit + "\n";
      } else {
        out += "Факт по еде: " + series.avgCalories + " ккал/д   дефицит " + series.actualDeficit + " ккал/д\n";
        out += "План в профиле: " + currentWeight + " → " + targetWeight + " кг   дефицит " + series.plannedDeficit + " ккал/д\n";
      }
      return out;
    }

    function animatePre(element, text) {
      if (!element) {
        return;
      }

      const html = text.split("\n").map((line) => {
        const firstPipe = line.indexOf("|");
        const lastPipe = line.lastIndexOf("|");
        if (firstPipe < 0 || lastPipe <= firstPipe) {
          return escapeHtml(line);
        }
        const left = escapeHtml(line.slice(0, firstPipe + 1));
        const right = escapeHtml(line.slice(lastPipe));
        const barText = line.slice(firstPipe + 1, lastPipe);
        let barHtml = "";
        for (let i = 0; i < barText.length; i++) {
          const char = barText[i];
          if (char === "░") {
            barHtml += '<span class="bar-inactive">░</span>';
          } else {
            barHtml += escapeHtml(char);
          }
        }
        return left + '<span class="bar-wrap"><span class="bar-fill">' + barHtml + "</span></span>" + right;
      }).join("\n");

      element.innerHTML = html;
    }

    function runBitGlitch() {
      const textNodes = [];
      document.querySelectorAll("pre").forEach((pre) => {
        const walker = document.createTreeWalker(pre, NodeFilter.SHOW_TEXT);
        let node;
        while ((node = walker.nextNode())) {
          if (node.parentElement && node.parentElement.closest(".bar-wrap")) {
            continue;
          }
          const text = node.nodeValue || "";
          let mutated = null;
          for (let i = 0; i < text.length; i++) {
            if (text[i] === "\n" || text[i] === " " || text[i] === "\t") {
              continue;
            }
            if (Math.random() < 0.0018) {
              mutated = mutated || text.split("");
              mutated[i] = Math.random() < 0.5 ? "0" : "1";
            }
          }
          if (mutated) {
            textNodes.push({ node, original: text, mutated: mutated.join("") });
          }
        }
      });

      if (!textNodes.length) {
        return;
      }

      textNodes.forEach((item) => {
        item.node.nodeValue = item.mutated;
      });

      setTimeout(() => {
        textNodes.forEach((item) => {
          if (item.node) {
            item.node.nodeValue = item.original;
          }
        });
      }, 70);
    }

    function startBitGlitch() {
      if (bitGlitchTimer) {
        clearInterval(bitGlitchTimer);
      }
      bitGlitchTimer = setInterval(runBitGlitch, 950);
    }

    function bindDayTabs() {
      document.querySelectorAll("#day-tabs .ptab").forEach((tab) => {
        tab.classList.toggle("active", tab.dataset.day === currentDayView);
        tab.onclick = () => {
          currentDayView = tab.dataset.day;
          if (globalProfile) {
            render(globalProfile, globalEntries, globalDailyMetrics, currentPeriod);
          }
        };
      });
    }

    function bindPeriodTabs() {
      document.querySelectorAll("#period-tabs .ptab").forEach((tab) => {
        tab.classList.toggle("active", tab.dataset.period === currentPeriod);
        tab.onclick = () => {
          currentPeriod = tab.dataset.period;
          if (globalProfile) {
            render(globalProfile, globalEntries, globalDailyMetrics, currentPeriod);
          }
        };
      });
    }

    function renderMobileSecondaryTabs() {
      const container = document.getElementById("mobile-secondary-tabs");
      if (!container) {
        return;
      }

      if (window.innerWidth >= 1200) {
        container.innerHTML = "";
        return;
      }

      if (currentMobileView === "tracker") {
        container.innerHTML = [
          '<button class="ptab' + (currentDayView === "yesterday" ? " active" : "") + '" type="button" data-mobile-day="yesterday">ВЧЕРА</button>',
          '<button class="ptab' + (currentDayView === "today" ? " active" : "") + '" type="button" data-mobile-day="today">СЕГОДНЯ</button>'
        ].join("");

        container.querySelectorAll("[data-mobile-day]").forEach((tab) => {
          tab.onclick = () => {
            currentDayView = tab.dataset.mobileDay;
            if (globalProfile) {
              render(globalProfile, globalEntries, globalDailyMetrics, currentPeriod);
            }
          };
        });
        return;
      }

      const periodOptions = [
        ["7", "7 ДН"],
        ["14", "14 ДН"],
        ["30", "30 ДН"],
        ["weeks", "НЕДЕЛИ"],
        ["months", "МЕСЯЦЫ"]
      ];
      container.innerHTML = periodOptions.map(([value, label]) =>
        '<button class="ptab' + (currentPeriod === value ? " active" : "") + '" type="button" data-mobile-period="' + value + '">' + label + "</button>"
      ).join("");

      container.querySelectorAll("[data-mobile-period]").forEach((tab) => {
        tab.onclick = () => {
          currentPeriod = tab.dataset.mobilePeriod;
          if (globalProfile) {
            render(globalProfile, globalEntries, globalDailyMetrics, currentPeriod);
          }
        };
      });
    }

    function syncMobileView() {
      const app = document.getElementById("app");
      const isMobile = window.innerWidth < 1200;
      if (app) {
        app.dataset.mobileView = isMobile ? currentMobileView : "all";
      }
      document.querySelectorAll("#mobile-view-tabs .mview-tab").forEach((tab) => {
        tab.classList.toggle("active", tab.dataset.mobileView === currentMobileView);
      });
      renderMobileSecondaryTabs();
    }

    function bindMobileViewTabs() {
      document.querySelectorAll("#mobile-view-tabs .mview-tab").forEach((tab) => {
        tab.onclick = () => {
          currentMobileView = tab.dataset.mobileView;
          syncMobileView();
          if (globalProfile) {
            render(globalProfile, globalEntries, globalDailyMetrics, currentPeriod);
          }
        };
      });
    }

    function render(profile, entries, dailyMetrics, period) {
      panelMetrics = computePanelMetrics();
      document.getElementById("title").textContent = "FOOD_TRACKER (" + getUserStamp(profile) + ")";
      const selectedDate = currentDayView === "yesterday" ? shiftDate(today(), -1) : today();
      const sectionTitle = currentDayView === "yesterday" ? "ВЧЕРА" : "СЕГОДНЯ";
      const selectedEntries = entries.filter((entry) => entry.date === selectedDate);
      animatePre(
        document.getElementById("left-panel"),
        buildToday(profile, selectedEntries, selectedDate, sectionTitle)
      );
      renderInteractiveMeals(selectedEntries);
      animatePre(
        document.getElementById("right-panel"),
        buildHistory(entries, profile, period) + "\n\n" + buildWeight(profile, dailyMetrics, period)
      );
      bindDayTabs();
      bindPeriodTabs();
      syncMobileView();
      startBitGlitch();
    }

    function renderInteractiveMeals(entries) {
      const container = document.getElementById("meals-interactive");
      if (!container) return;
      const mealOrder = ["breakfast","lunch","dinner","snack"];
      const mealLabels = {breakfast:"Завтрак",lunch:"Обед",dinner:"Ужин",snack:"Перекусы"};
      let html = "";
      mealOrder.forEach(key => {
        const mealEntries = entries.filter(e => e.meal === key);
        if (!mealEntries.length) return;
        html += '<div class="meal-header-row"><span>' + mealLabels[key].toUpperCase() + '</span> <span>' + Math.round(mealEntries.reduce((s,e) => s + Number(e.calories||0), 0)) + ' ккал</span></div>';
        mealEntries.forEach(e => {
          const kcal = Math.round(Number(e.calories) || 0);
          const macros = 'Б:' + round1(e.protein) + ' Ж:' + round1(e.fat) + ' У:' + round1(e.carbs) + ' Кл:' + round1(e.fiber);
          html += '<div class="meal-entry" data-entry-id="' + e.id + '">';
          html += '<div class="meal-entry-main"><div class="meal-entry-title">' + escapeHtml(e.description) + '</div>';
          html += '<div class="meal-entry-meta">' + Math.round(e.weight_g) + 'г ' + macros + '</div></div>';
          html += '<div class="meal-entry-cal">' + kcal + '</div></div>';
        });
      });
      if (!html) {
        html = '<div style="color:var(--term-dim);padding:0.5em 0;font-size:0.9em">Нет записей за этот день. Нажми + чтобы добавить.</div>';
      }
      container.innerHTML = html;

      container.querySelectorAll(".meal-entry").forEach(el => {
        el.addEventListener("click", function() {
          const id = this.dataset.entryId;
          const entry = globalEntries.find(e => e.id === id);
          if (entry) openEntryEditor(entry);
        });
      });
    }

    function openEntryEditor(entry) {
      const overlay = document.getElementById("modal-overlay");
      const box = document.getElementById("modal-box");
      const isNew = !entry;
      const e = entry || {date: currentDayView === "yesterday" ? shiftDate(today(), -1) : today(), meal:"breakfast", description:"", weight_g:0, calories:0, protein:0, fat:0, carbs:0, fiber:0, sugar:0, sodium_mg:0, saturated_fat:0};
      box.innerHTML = '<h2>' + (isNew ? 'ДОБАВИТЬ ЗАПИСЬ' : 'РЕДАКТИРОВАТЬ') + '</h2>' +
        '<label>Дата <input id="m-date" type="date" value="' + e.date + '"></label>' +
        '<label>Приём пищи <select id="m-meal">' +
          ['breakfast','lunch','dinner','snack'].map(m => '<option' + (m===e.meal?' selected':'') + '>' + m + '</option>').join('') +
        '</select></label>' +
        '<label>Описание <textarea id="m-desc" rows="2">' + escapeHtml(e.description) + '</textarea></label>' +
        '<label>Вес (г) <input id="m-weight" type="number" step="1" value="' + Math.round(e.weight_g) + '"></label>' +
        '<label>Калории <input id="m-cal" type="number" step="1" value="' + Math.round(e.calories) + '"></label>' +
        '<label>Белки (г) <input id="m-protein" type="number" step="0.1" value="' + round1(e.protein) + '"></label>' +
        '<label>Жиры (г) <input id="m-fat" type="number" step="0.1" value="' + round1(e.fat) + '"></label>' +
        '<label>Углеводы (г) <input id="m-carbs" type="number" step="0.1" value="' + round1(e.carbs) + '"></label>' +
        '<label>Клетчатка (г) <input id="m-fiber" type="number" step="0.1" value="' + round1(e.fiber) + '"></label>' +
        '<label>Сахар (г) <input id="m-sugar" type="number" step="0.1" value="' + round1(e.sugar) + '"></label>' +
        '<label>Натрий (мг) <input id="m-sodium" type="number" step="1" value="' + Math.round(e.sodium_mg) + '"></label>' +
        '<label>Насыщ. жиры (г) <input id="m-satfat" type="number" step="0.1" value="' + round1(e.saturated_fat) + '"></label>' +
        '<div class="modal-actions">' +
          '<button class="primary" id="m-save">СОХРАНИТЬ</button>' +
          (!isNew ? '<button class="danger" id="m-delete">УДАЛИТЬ</button>' : '') +
          '<button id="m-cancel">ОТМЕНА</button>' +
        '</div>';
      overlay.classList.add("active");

      document.getElementById("m-cancel").onclick = () => overlay.classList.remove("active");
      document.getElementById("m-save").onclick = async () => {
        const data = {
          date: document.getElementById("m-date").value,
          meal: document.getElementById("m-meal").value,
          description: document.getElementById("m-desc").value,
          weight_g: parseFloat(document.getElementById("m-weight").value) || 0,
          calories: parseFloat(document.getElementById("m-cal").value) || 0,
          protein: parseFloat(document.getElementById("m-protein").value) || 0,
          fat: parseFloat(document.getElementById("m-fat").value) || 0,
          carbs: parseFloat(document.getElementById("m-carbs").value) || 0,
          fiber: parseFloat(document.getElementById("m-fiber").value) || 0,
          sugar: parseFloat(document.getElementById("m-sugar")?.value) || 0,
          sodium_mg: parseFloat(document.getElementById("m-sodium")?.value) || 0,
          saturated_fat: parseFloat(document.getElementById("m-satfat")?.value) || 0,
        };
        try {
          if (isNew) {
            await apiPost("/api/entries", data);
          } else {
            await apiPut("/api/entries/" + e.id, data);
          }
          overlay.classList.remove("active");
          await loadData();
        } catch (err) {
          alert("Ошибка: " + err.message);
        }
      };
      if (!isNew) {
        document.getElementById("m-delete").onclick = async () => {
          if (!confirm("Удалить запись?")) return;
          try {
            await apiDelete("/api/entries/" + e.id);
            overlay.classList.remove("active");
            await loadData();
          } catch (err) {
            alert("Ошибка: " + err.message);
          }
        };
      }
    }

    /* AI chat */
    function toggleAIChat() {
      const panel = document.getElementById("ai-chat-panel");
      panel.classList.toggle("active");
      if (panel.classList.contains("active")) {
        document.getElementById("ai-input").focus();
      }
    }

    function addAIMessage(role, text, changes) {
      const container = document.getElementById("ai-chat-msgs");
      const div = document.createElement("div");
      div.className = "ai-msg ai-msg-" + role;
      if (role === "user") {
        div.textContent = "> " + text;
      } else {
        let html = '<div class="ai-msg-explanation">' + escapeHtml(text) + '</div>';
        if (changes && changes.length) {
          html += '<ul class="ai-msg-changes">';
          changes.forEach((c, i) => {
            const label = ({add_entry:"➕ Добавить", update_entry:"✏️ Изменить", delete_entry:"🗑️ Удалить", update_profile:"⚙️ Профиль", update_metric:"📊 Метрика"})[c.type] || c.type;
            html += '<li>' + label + ' — ' + escapeHtml(c.description || JSON.stringify(c.data)) + '</li>';
          });
          html += '</ul>';
          html += '<button class="ai-apply-btn">ПРИМЕНИТЬ</button>';
        }
        div.innerHTML = html;
        const applyBtn = div.querySelector(".ai-apply-btn");
        if (applyBtn) {
          applyBtn._changes = changes;
          applyBtn.onclick = async function() {
            const ch = this._changes;
            try {
              const result = await apiPost("/api/ai/apply", {changes: ch});
              addAIMessage("assistant", "✅ Применено: " + result.applied + " изменений" + (result.errors?.length ? ", ошибок: " + result.errors.length : ""), null);
              this.remove();
              await loadData();
            } catch (err) {
              addAIMessage("assistant", "❌ Ошибка: " + err.message, null);
            }
          };
        }
      }
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    async function sendAIMessage() {
      const input = document.getElementById("ai-input");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      addAIMessage("user", text, null);
      try {
        const result = await apiPost("/api/ai/parse", {message: text});
        const explanation = result.explanation || "Изменений не найдено.";
        const changes = result.changes || [];
        addAIMessage("assistant", explanation, changes.length ? changes : null);
      } catch (err) {
        addAIMessage("assistant", "❌ Ошибка: " + err.message, null);
      }
    }

    async function apiGet(path) {
      const r = await fetch(path + "?t=" + Date.now());
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }
    async function apiPost(path, data) {
      const r = await fetch(path, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(data) });
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }
    async function apiPut(path, data) {
      const r = await fetch(path, { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(data) });
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }
    async function apiDelete(path) {
      const r = await fetch(path, { method: "DELETE" });
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }

    async function loadData() {
      try {
        const data = await apiGet("/api/summary");

        globalProfile = data.profile || {};
        globalEntries = Array.isArray(data.entries) ? data.entries : [];
        globalDailyMetrics = Array.isArray(data.daily_metrics) ? data.daily_metrics : [];

        render(globalProfile, globalEntries, globalDailyMetrics, currentPeriod);
      } catch (error) {
        document.getElementById("app").innerHTML = "<pre>Ошибка загрузки.\n\n" + error.message + "\n\nЗапусти сервер через python3 server.py</pre>";
      }
    }

    updateResponsiveScale();
    loadData();
    bindMobileViewTabs();
    syncMobileView();
    setInterval(loadData, 60000);

    document.getElementById("fab-btn").addEventListener("click", () => openEntryEditor(null));
    document.getElementById("ai-toggle").addEventListener("click", toggleAIChat);
    document.getElementById("ai-chat-close").addEventListener("click", toggleAIChat);
    document.getElementById("ai-send").addEventListener("click", sendAIMessage);
    document.getElementById("ai-input").addEventListener("keydown", (e) => { if (e.key === "Enter") sendAIMessage(); });
    document.getElementById("modal-overlay").addEventListener("click", (e) => {
      if (e.target === e.currentTarget) e.target.classList.remove("active");
    });

    window.addEventListener("resize", () => {
      updateResponsiveScale();
      syncMobileView();
      if (globalProfile) {
        render(globalProfile, globalEntries, globalDailyMetrics, currentPeriod);
      }
    });
  </script>
