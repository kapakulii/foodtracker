services:
  foodtracker:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./index.html:/app/index.html
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
    restart: unless-stopped
