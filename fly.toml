app = "foodtracker"

[build]

[[services]]
  http_checks = []
  internal_port = 8080
  processes = ["app"]
  protocol = "tcp"
  script_checks = []

  [[services.ports]]
    handlers = ["http"]
    port = 80
    
  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.concurrency]]
    hard_limit = 25
    soft_limit = 10
    type = "connections"

[[mounts]]
  source = "foodtracker_data"
  destination = "/app/data"

[env]
  AI_MODEL = "deepseek-v4-flash"
  OPENAI_BASE_URL = "https://api.deepseek.com/v1"
